name: Publish Bafu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and content
        run: |
          for file in *.js; do node --check "$file"; done
          node scripts/validate.mjs
          node scripts/build-miniprogram-data.mjs
          git diff --exit-code -- miniprogram/data miniprogram/assets
          node scripts/test-miniprogram.mjs
      - name: Prepare static site
        run: |
          mkdir public
          cp index.html style.css app.js catalogue.js cookie.js guanyin.js liuyao.js lore.js tarot.js yijing-data.js .nojekyll public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
